name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install parse5 (CI only, not in package.json)
        run: npm install --no-save parse5@^7

      - name: Verify HTML and JavaScript files
        run: node scripts/check-files.mjs
