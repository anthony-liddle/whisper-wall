name: deploy

on:
  push:
    branches: [main]
    # Docs-only commits do not deploy. Each deploy clears the in-memory wall,
    # so a README typo should not wipe the shared art. A push is skipped only
    # when EVERY changed file matches one of these patterns, so any commit that
    # also touches code still deploys.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  # Manual trigger: dry-run the pipeline or deploy on demand without a push.
  workflow_dispatch:

# Serialize deploys so two pushes can't deploy at once. Never cancel an
# in-progress deploy mid-flight.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install parse5 (CI only, not in package.json)
        run: npm install --no-save parse5@^7

      - name: Verify HTML and JavaScript files
        run: node scripts/check-files.mjs

      # Steps below run only if the verify step above passed. A failed check
      # fails the job before flyctl is ever installed, so a broken commit
      # never deploys.
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
